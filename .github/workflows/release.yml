name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version from tag
        shell: pwsh
        run: echo "VERSION=$('${{ github.ref_name }}'.TrimStart('v'))" >> $env:GITHUB_ENV

      - name: Test
        run: dotnet test tests\DevCleaner.Tests -c Release

      - name: Publish GUI and CLI
        run: |
          dotnet publish src\DevCleaner.Gui -c Release -r win-x64 --self-contained -p:Version=${{ env.VERSION }} -o out\gui
          dotnet publish src\DevCleaner.Cli -c Release -r win-x64 --self-contained -p:Version=${{ env.VERSION }} -p:PublishSingleFile=true -o out\cli

      - name: Build MSI
        run: |
          dotnet tool install --global wix --version 5.*
          wix build installer\DevCleaner.wxs -arch x64 -d Version=${{ env.VERSION }} -d PublishDir=${{ github.workspace }}\out\gui -o out\DevCleaner-${{ env.VERSION }}-x64.msi

      - name: Zip CLI
        shell: pwsh
        run: Compress-Archive out\cli\* out\devcleaner-cli-${{ env.VERSION }}-win-x64.zip

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            out/*.msi
            out/*.zip
