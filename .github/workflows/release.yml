name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version from tag
        shell: pwsh
        run: echo "VERSION=$('${{ github.ref_name }}'.TrimStart('v'))" >> $env:GITHUB_ENV

      - name: Test
        run: dotnet test tests\DevCleaner.Tests -c Release

      - name: Publish GUI and CLI
        run: |
          dotnet publish src\DevCleaner.Gui -c Release -r win-x64 --self-contained -p:Version=${{ env.VERSION }} -o out\gui
          dotnet publish src\DevCleaner.Cli -c Release -r win-x64 --self-contained -p:Version=${{ env.VERSION }} -p:PublishSingleFile=true -o out\cli

      - name: Package GUI with Velopack
        shell: pwsh
        run: |
          dotnet tool install --global vpk --version 1.2.161
          # Previous release lets vpk build a small delta package; none exists for the first Velopack release.
          vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} -o out\releases
          vpk pack --packId DevCleaner --packVersion ${{ env.VERSION }} --packDir out\gui --mainExe DevCleaner.exe --packTitle DevCleaner --icon src\DevCleaner.Gui\Assets\devcleaner.ico -o out\releases

      - name: Zip CLI
        shell: pwsh
        run: Compress-Archive out\cli\* out\devcleaner-cli-${{ env.VERSION }}-win-x64.zip

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            out/releases/*
            out/*.zip
